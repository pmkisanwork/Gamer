<style>
:root{--bg:#f3f7fc;--card:#fff;--tx:#0d1b2e;--mu:#5b6f86;--line:#d9e3ef;--inp:#f7faff;--cy:#0891b2;--bl:#1d6bff;--ok:#0f9f64;--wa:#d98300;--er:#e11d48;--sh:0 6px 24px #1d4e8914;--btxt:#fff;--hd:#ffffffd9}
[data-theme=dark]{--bg:#050b14;--card:#0b1a2b;--tx:#e6f4ff;--mu:#8aa7bd;--line:#1c3a56;--inp:#06121f;--cy:#22d3ee;--bl:#2f8cff;--ok:#22e58b;--wa:#ffb020;--er:#ff4d6d;--sh:0 0 22px #22d3ee1a;--btxt:#00121f;--hd:#050b14e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,'Segoe UI',Roboto,system-ui,sans-serif;min-height:100vh;transition:background .3s,color .3s}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--hd);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header img{height:42px;width:42px;object-fit:cover;border-radius:10px}header b{font:700 18px Rajdhani,Inter,sans-serif;letter-spacing:2px;background:linear-gradient(90deg,var(--bl),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}#na{display:contents}nav a{color:var(--tx);text-decoration:none;padding:7px 11px;border-radius:9px;font-weight:600;font-size:14px}nav a:hover,nav a.on{background:var(--line);color:var(--cy)}
#tg{background:var(--line);border:0;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px 14px 60px;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1,h2,h3{margin:.4em 0;font-family:Rajdhani,Inter,sans-serif;letter-spacing:1px}h1{font-size:clamp(26px,6vw,42px)}
a{color:var(--cy)}
.hero{text-align:center;padding:26px 14px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#1d6bff,#0ac7e8 70%,#12e3c0);box-shadow:var(--sh)}
[data-theme=dark] .hero{background:linear-gradient(135deg,#0b2a4d,#0a4a63 70%,#0a6a70)}
.hero img{width:130px;max-width:40%;border-radius:20px;box-shadow:0 8px 30px #0006}.hero h1{margin:.3em 0;color:#fff}.hero .mu{color:#e6fbff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);transition:.25s}.card:hover{border-color:var(--cy);transform:translateY(-2px)}
.btn{background:linear-gradient(90deg,var(--bl),var(--cy));color:var(--btxt);border:0;border-radius:10px;padding:10px 18px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;transition:.2s;margin:2px 0}
.hero .btn.g{color:#fff;border-color:#fff}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.g{background:transparent;color:var(--cy);border:1.5px solid var(--cy)}.btn.r{background:var(--er);color:#fff}.btn.o{background:var(--ok);color:#fff}
input,textarea,select{width:100%;background:var(--inp);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;margin:4px 0 10px}input:focus,textarea:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px #22d3ee33}
label{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.slot{border:1.5px solid;border-radius:12px;padding:9px;text-align:center;font-size:12px;cursor:pointer;background:var(--card)}.slot b{font-size:20px;display:block}
.slot.available{border-color:var(--ok);color:var(--ok)}.slot.available:hover{transform:scale(1.05);box-shadow:0 4px 14px #0f9f6455}.slot.pending{border-color:var(--wa);color:var(--wa);cursor:not-allowed}.slot.booked{border-color:var(--er);color:var(--er);cursor:not-allowed;opacity:.6}
.tag{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid}.CONFIRMED{color:var(--ok)}.PENDING_VERIFICATION,.AWAITING_PAYMENT{color:var(--wa)}.REJECTED,.EXPIRED{color:var(--er)}
.modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;justify-content:center;overflow:auto;padding:14px}.modal>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:470px;margin:auto;box-shadow:0 20px 60px #0006}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}.stat b{font-size:28px;color:var(--cy);display:block}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--cy);font-size:12px;text-transform:uppercase}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.mu{color:var(--mu)}.err{color:var(--er);min-height:20px;font-size:14px}.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--cy);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}@keyframes s{to{transform:rotate(360deg)}}
.zoom{overflow:auto;max-height:80vh}.zoom img{width:100%;cursor:zoom-in}.zoom img.z{width:200%;cursor:zoom-out}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}

/* ===== GAMER THEME ===== */
:root{--vi:#7c3aed;--pk:#ec4899}
[data-theme=dark]{--bg:#05060f;--card:#0d1020;--line:#222a4a;--inp:#080b18;--cy:#00e5ff;--bl:#6d5dfc;--vi:#8b5cf6;--pk:#ff3d9a;--mu:#8e9bc4;--sh:0 0 0 1px #00e5ff14,0 8px 30px #0008;--hd:#070914e6}
body{background-image:radial-gradient(circle at 12% -8%,#6d5dfc2e,transparent 45%),radial-gradient(circle at 92% 8%,#00e5ff1c,transparent 40%);background-attachment:fixed}
[data-theme=dark] body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
main{position:relative;z-index:1}
header b{font-family:Orbitron,Rajdhani,sans-serif;font-size:16px;letter-spacing:3px}
header img{box-shadow:0 0 14px #00e5ff66;border:1px solid var(--cy)}
nav a{font-family:Rajdhani,Inter,sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:1px}
nav a.on{box-shadow:inset 0 -2px 0 var(--cy)}
h1,h2,h3{font-family:Rajdhani,Inter,sans-serif;text-transform:uppercase}
main>h1{background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;letter-spacing:3px}
h2.sec{margin:26px 0 12px;padding-left:12px;border-left:4px solid var(--cy);letter-spacing:2px}
.hero{position:relative;overflow:hidden;padding:44px 16px;border-radius:26px;border:1px solid #ffffff26;background:linear-gradient(135deg,#1b1464,#5b21b6 50%,#0e7490)}
[data-theme=dark] .hero{background:linear-gradient(135deg,#0c0a2e,#2a1065 50%,#06485a);box-shadow:0 0 50px #6d5dfc33}
.hero::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 70%,#00e5ff40 85%,transparent);animation:rot 10s linear infinite}
.hero>*{position:relative}@keyframes rot{to{transform:rotate(360deg)}}
.hero img{border:2px solid #ffffff66;box-shadow:0 0 40px #00e5ff77;animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.hero h1{font-family:Orbitron,Rajdhani,sans-serif;font-size:clamp(24px,6.5vw,44px);letter-spacing:3px;text-shadow:0 0 26px #00e5ffaa}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.chips span{background:#ffffff1c;border:1px solid #ffffff38;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
.hstats{display:flex;justify-content:center;gap:34px;margin:14px 0 18px}.hstats b{display:block;font:800 30px Orbitron,sans-serif;color:#fff;text-shadow:0 0 14px #00e5ff}.hstats small{color:#d6f6ff;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.card{border-radius:18px}[data-theme=dark] .card:hover{box-shadow:0 0 0 1px var(--cy),0 0 28px #00e5ff30}
.mc{position:relative;overflow:hidden;padding-top:22px}.mc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk))}
.pill{position:absolute;right:12px;top:14px;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:99px;border:1px solid}.pill.live{color:var(--ok);animation:pu 1.6s infinite}.pill.off{color:var(--er)}@keyframes pu{50%{box-shadow:0 0 12px #22e58b88}}
.mc h3{margin-right:70px;font-size:21px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:0 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));border-radius:9px}
.btn{font-family:Rajdhani,Inter,sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:1.2px;box-shadow:0 4px 18px #00e5ff30}.btn.g{box-shadow:none}.btn.g:hover{background:#00e5ff18}
.hero .btn{box-shadow:0 4px 18px #0006}
.slot{border-radius:12px;transition:.2s}.slot.available{background:#22e58b0f}.slot.pending{background:#ffb02010}
.modal{backdrop-filter:blur(5px);background:#000b}.modal>div{border-color:var(--cy);box-shadow:0 0 40px #00e5ff30}
input:focus,textarea:focus{box-shadow:0 0 0 3px #00e5ff33}
.tabs .btn.g{border-radius:99px}.tabs .btn.g.on{background:linear-gradient(90deg,var(--bl),var(--cy));color:var(--btxt);border-color:transparent}
.stat{position:relative;overflow:hidden}.stat .ic{position:absolute;right:12px;top:8px;font-size:34px;opacity:.28}
.stat:nth-child(1) b{color:var(--cy)}.stat:nth-child(2) b{color:var(--ok)}.stat:nth-child(3) b{color:var(--wa)}.stat:nth-child(4) b{color:var(--vi)}.stat:nth-child(5) b{color:var(--pk)}.stat:nth-child(6) b{color:var(--bl)}
.stat b{font-family:Orbitron,sans-serif;font-size:26px}
th{background:#00e5ff0d;letter-spacing:1px}tr:hover td{background:#00e5ff08}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:800 34px Orbitron,sans-serif;color:#fff;background:linear-gradient(135deg,var(--vi),var(--cy));margin:0 auto 12px;box-shadow:0 0 30px #00e5ff55}
@media(max-width:560px){header b{display:none}.hstats{gap:22px}}
.warn{background:#ffb020;color:#1a1200;padding:8px 12px;font-size:13px;font-weight:700;text-align:center}

/* ===== AUTH PAGES ===== */
.authwrap{min-height:calc(100vh - 150px);display:grid;place-items:center;padding:10px 0}
.authcard{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 24px 24px;position:relative;overflow:hidden;box-shadow:var(--sh);animation:in .4s}
[data-theme=dark] .authcard{box-shadow:0 0 0 1px #00e5ff22,0 0 60px #6d5dfc33}
.authcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk))}
.authcard h1{text-align:center;font-size:28px;margin:.2em 0 0;letter-spacing:3px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.authcard>.mu{text-align:center;margin:2px 0 18px}
.alogo{display:block;margin:0 auto 8px;width:78px;height:78px;border-radius:20px;object-fit:cover;border:2px solid var(--cy);box-shadow:0 0 28px #00e5ff66;animation:fl 4s ease-in-out infinite}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg a{text-align:center;padding:9px;border-radius:9px;text-decoration:none;font:700 15px Rajdhani,Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--mu)}
.seg a.on{background:linear-gradient(90deg,var(--bl),var(--cy));color:var(--btxt)}
.fld{position:relative;margin:4px 0 12px}.fld input{margin:0;padding-left:42px;padding-right:44px;height:46px}
.fld span{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.85}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:16px;cursor:pointer;padding:8px}
.btn.full{width:100%;padding:13px;font-size:16px}.ctr{text-align:center}
.okmsg{text-align:center;padding:10px 0}.okmsg b{font-size:44px;display:block}

/* ===== v2: MENU / FOOTER / GAMES / ADMIN ===== */
.hb{margin-left:auto;width:46px;height:46px;border-radius:13px;border:1px solid var(--cy);background:var(--card);display:grid;place-content:center;gap:5px;cursor:pointer;box-shadow:0 0 16px #00e5ff33;padding:0}
.hb span{display:block;width:22px;height:2.5px;border-radius:3px;background:var(--cy);transition:.3s}
.hb.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}.hb.open span:nth-child(2){opacity:0}.hb.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
header nav{display:none;position:absolute;top:calc(100% + 8px);right:12px;width:min(270px,calc(100vw - 24px));flex-direction:column;align-items:stretch;gap:4px;margin:0;padding:10px;background:var(--card);border:1px solid var(--cy);border-radius:18px;box-shadow:0 14px 40px #0009,0 0 30px #00e5ff22;z-index:40;animation:in .25s}
header nav.open{display:flex}
header nav a{display:block;padding:13px 16px;font-size:17px;border-radius:12px;width:100%}
header nav a:hover{background:linear-gradient(90deg,#6d5dfc33,#00e5ff22)}
header nav #tg{width:100%;height:auto;border-radius:12px;padding:12px 16px;font:600 15px Rajdhani,Inter,sans-serif;text-align:left;margin-top:6px;border:1px dashed var(--line);color:var(--tx)}
.ovl{position:fixed;inset:0;z-index:15;background:#0007;backdrop-filter:blur(2px);display:none}.ovl.open{display:block}
header b{display:none}
/* footer */
.ft{position:relative;z-index:1;text-align:center;padding:28px 16px 34px;margin-top:24px;border-top:1px solid var(--line);background:var(--hd);backdrop-filter:blur(10px)}
.ft::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk))}
.ft img{width:54px;height:54px;border-radius:14px;border:1px solid var(--cy);box-shadow:0 0 18px #00e5ff55;display:block;margin:0 auto 8px}
.ft>b{display:block;font:800 15px Orbitron,sans-serif;letter-spacing:3px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.ft p{margin:3px 0;font-size:13px;color:var(--mu)}.ft .dev b{color:var(--cy)}
/* games */
.ggrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:12px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);transition:.25s}
.gcard:hover{transform:translateY(-4px);border-color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 10px 34px #00e5ff30}
.gimg{position:relative;height:140px;display:grid;place-items:center;overflow:hidden}
.gimg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff12 0 2px,transparent 2px 18px),radial-gradient(circle at 75% 20%,#ffffff40,transparent 45%)}
.gimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gimg i{position:absolute;left:-6px;bottom:-14px;font:800 52px/1 Orbitron,sans-serif;font-style:normal;color:#ffffff1f;white-space:nowrap;text-transform:uppercase}
.ge{position:relative;font-size:64px;filter:drop-shadow(0 6px 14px #0009);transition:.3s}.gcard:hover .ge{transform:scale(1.15) rotate(-6deg)}
.hot{position:absolute;right:10px;top:10px;font:800 11px Rajdhani,sans-serif;font-style:normal;letter-spacing:1px;background:#000a;color:#ffd36b;border:1px solid #ffd36b88;border-radius:99px;padding:3px 10px}
.gb{padding:14px 16px 16px}.gb h3{margin:0 0 6px;font-size:21px}.gb p{margin:8px 0 0;font-size:13.5px}
.gt{display:flex;flex-wrap:wrap;gap:6px}.gt span{font:700 11px Rajdhani,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid var(--cy);color:var(--cy);background:#00e5ff10}
/* admin */
.ahero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px;border-radius:24px;color:#fff;border:1px solid #ffffff26;background:linear-gradient(135deg,#1b1464,#5b21b6 55%,#0e7490);box-shadow:0 0 40px #6d5dfc33}
[data-theme=dark] .ahero{background:linear-gradient(135deg,#0c0a2e,#2a1065 55%,#06485a)}
.ahero::before{content:"";position:absolute;inset:-80%;background:conic-gradient(from 0deg,transparent 0 75%,#00e5ff38 88%,transparent);animation:rot 12s linear infinite}
.ahero>*{position:relative}
.ahero img{width:66px;height:66px;border-radius:18px;object-fit:cover;border:2px solid #ffffff66;box-shadow:0 0 28px #00e5ff77}
.ahero small{display:block;font:700 11px Rajdhani,sans-serif;letter-spacing:2px;color:#bff6ff}
.ahero h1{margin:0;font:800 clamp(22px,6vw,32px) Orbitron,sans-serif;letter-spacing:3px;color:#fff;text-shadow:0 0 22px #00e5ffaa}
.ahero span{font-size:12px;color:#d6f6ff;letter-spacing:1px}
.ahero .btn.r{margin-left:auto;box-shadow:0 4px 18px #0006}
.atabs{flex-wrap:nowrap;overflow-x:auto;gap:8px;margin:14px 0;padding:4px 2px 8px;scrollbar-width:none}.atabs::-webkit-scrollbar{display:none}
.atabs .btn.g{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:10px 16px;background:var(--card)}
.atabs .btn.g em{font-style:normal;font-size:17px}
.atabs .btn.g.on{box-shadow:0 4px 22px #00e5ff55}
#t .stats{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
#t .stat{padding:20px 16px 16px;font:700 12px Rajdhani,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--sc,var(--cy)) 14%,var(--card)))}
#t .stat::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--sc,var(--cy))}
#t .stat b{font-size:30px;margin-bottom:4px;text-shadow:0 0 18px color-mix(in srgb,currentColor 50%,transparent)}
.stat:nth-child(1){--sc:var(--cy)}.stat:nth-child(2){--sc:var(--ok)}.stat:nth-child(3){--sc:var(--wa)}.stat:nth-child(4){--sc:var(--vi)}.stat:nth-child(5){--sc:var(--pk)}.stat:nth-child(6){--sc:var(--bl)}
#t .tbl{padding:6px;border-radius:18px}#t .tbl table{min-width:620px}
#t th{padding:12px 10px;font-family:Rajdhani,sans-serif}#t tr:nth-child(even) td{background:#00e5ff06}
#t .tbl .btn{padding:6px 11px;font-size:13px}
.pill2{font:800 12px Rajdhani,sans-serif;letter-spacing:1px;padding:3px 11px;border-radius:99px;border:1px solid}.pill2.on{color:var(--ok)}.pill2.off{color:var(--er)}
#t .card h3{margin-top:0}
</style>

 $('#m>div').innerHTML=`<h3>Complete Payment</h3><p>${esc(b.match_name)} · Slot #${b.slot_number}<br><span class="mu">${esc(b.match_date)} ${esc(b.match_time)} · Booking ${esc(b.code)}</span></p>

window.submitPay=async(e,code)=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;

 shell(L?'WELCOME BACK':'JOIN THE GAME',L?'Login to book your slot':'Create your gamer account',`<div class="seg"><a href="#/login" class="${L?'on':''}">Login</a><a href="#/signup" class="${L?'':'on'}">Sign Up</a></div>

window.form=(mid,sid)=>{if(!USER){authM('login');return}const s=_sl.find(x=>x.id===sid);
 modal(`<h3>Slot #${s.number} · ₹${s.price}</h3><p class="mu">Booking as ${esc(USER.name)} · ${esc(USER.mobile)}</p><form onsubmit="book(event,${mid},${sid})"><div class="row"><div><label>BGMI / Game ID</label><input name="game_id" value="${esc(USER.game_id)}" required></div><div><label>In-game Name</label><input name="ign" value="${esc(USER.ign)}" required></div></div><p class="err" id="e"></p><button class="btn">Continue to Payment</button> <button type="button" class="btn g" onclick="closeM()">Cancel</button></form>`)};
function my(){if(!USER){authM('login');return}app.innerHTML='<h1>🎟️ MY BOOKINGS</h1><div id="out"><div class="spin"></div></div>';
 api('/api/my-bookings',{method:'POST',body:{}}).then(r=>{$('#out').innerHTML=r.length?`<div class="grid">${r.map(b=>`<div class="card"><b>${esc(b.code)}</b> ${tag(b.status)}<p>${esc(b.match_name)} · Slot #${b.slot_number}<br>${esc(b.match_date)} ${esc(b.match_time)}</p><p>Amount: ₹${b.amount}<br>Payment: ${esc(b.pay_status||'Not submitted')}</p><p class="mu">${stMsg[b.status]}${b.note?' Note: '+esc(b.note):''}</p></div>`).join('')}</div>`:'<p class="mu">No bookings yet.</p>'}).catch(x=>$('#out').innerHTML=`<p class="err">${esc(x.message)}</p>`)}
function admin(){if(!TOKEN){shell('ADMIN LOGIN','Owner access only',`<form id="f"><label>Owner Mobile Number</label><div class="fld"><span>📱</span><input name="mobile" inputmode="numeric" maxlength="10" required></div><label>Password</label><div class="fld"><span>🔒</span><input name="password" type="password" required autocomplete="current-password">${eye}</div><p class="err" id="e"></p><button class="btn full">Login</button><p class="ctr"><a href="#/forgot-admin">Forgot password?</a></p></form><p class="ctr mu" style="margin:14px 0 0"><a href="#/">← Back to site</a></p>`);
  $('#f').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/admin/login',{method:'POST',body:fd(e.target)});TOKEN=r.token;sessionStorage.setItem('ftw_admin',TOKEN);admin()}catch(x){$('#e').textContent=x.message}};return}
 app.innerHTML=`<div class="ahero"><img src="${$('header img').src}" alt=""><div><small>WELCOME BACK, OWNER</small><h1>ADMIN PANEL</h1><span>FTW OFFICIAL ORGANIZATION</span></div><button class="btn r" onclick="auth.signOut();TOKEN='';sessionStorage.clear();route()">⎋ Logout</button></div><div class="tabs atabs">${[['📊','Overview'],['🎮','Matches'],['⏳','Pending'],['👥','Gamers'],['💳','Payments'],['👤','Profile']].map((t,i)=>`<button class="btn g" onclick="tab(${i})"><em>${t[0]}</em><span>${t[1]}</span></button>`).join('')}</div><div id="t"></div>`;tab(0)}
async function gamers(t){const r=await api('/api/admin/gamers');t.innerHTML=`<p class="mu">${r.length} registered gamers</p><div class="card tbl"><table><tr><th>#</th><th>Name</th><th>Mobile</th><th>Email</th><th>Game ID</th><th>IGN</th><th>Joined</th></tr>${r.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.name)}</td><td>${esc(g.mobile)}</td><td>${esc(g.email)}</td><td>${esc(g.game_id)}</td><td>${esc(g.ign)}</td><td>${g.created?new Date(g.created).toLocaleDateString():''}</td></tr>`).join('')}</table></div>`}
async function prof(t){const a=await api('/api/admin/profile');t.innerHTML=`<div class="card" style="max-width:460px"><div class="av">${esc((a.name||'A')[0].toUpperCase())}</div><h3 style="text-align:center;margin-top:0">${esc(a.name)}</h3><form id="f"><label>Owner Name</label><input name="name" value="${esc(a.name)}" required><label>Mobile Number</label><input name="mobile" value="${esc(a.mobile)}" maxlength="10" required>
 <label>Gmail / Email</label><input name="contact_email" type="email" value="${esc(a.contact_email)}"><p class="mu">Login account email: ${esc(a.email)}</p><label>New Password (optional)</label><input name="password" type="password" minlength="6"><p class="err" id="e"></p><button class="btn">Save Profile</button></form></div>`;$('#f').onsubmit=sub('/api/admin/profile')}

function support(){app.innerHTML=`<h1>SUPPORT</h1><div class="card"><p>Facing a payment or slot issue? Contact the FTW OFFICIAL ORGANIZATION team on our official channels and share your Booking ID.</p><p class="mu">Edit this section with your Discord / Telegram / WhatsApp links.</p></div>`}

// ---------- ADMIN ----------
window.tab=async i=>{document.querySelectorAll('.tabs .btn.g').forEach((b,j)=>b.classList.toggle('on',j===i));const t=$('#t');t.innerHTML='<div class="spin"></div>';try{await [ovw,mat,pend,gamers,sett,prof][i](t)}catch(x){t.innerHTML=`<p class="err">${esc(x.message)}</p>`}};
async function ovw(t){const s=await api('/api/admin/stats');const L={total:'Total Bookings',confirmed:'Confirmed Slots',pending:'Pending Payments',available:'Available Slots',revenue:'Total Revenue (₹)',today:"Today's Bookings"};
 const I={total:'🎟️',confirmed:'✅',pending:'⏳',available:'🎮',revenue:'💰',today:'⚡'};t.innerHTML=`<div class="stats">${Object.keys(L).map(k=>`<div class="card stat"><span class="ic">${I[k]}</span><b>${s[k]}</b>${L[k]}</div>`).join('')}</div>`}
async function mat(t){const ms=await api('/api/admin/matches');window._am=ms;
 t.innerHTML=`<button class="btn" onclick="mform()">+ New Match</button><div class="card tbl" style="margin-top:12px"><table><tr><th>Name</th><th>Date</th><th>Slots</th><th>Price</th><th>Booking</th><th></th></tr>${ms.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.match_date)} ${esc(m.match_time)}</td><td>${m.total_slots}</td><td>₹${m.price||0}</td><td><span class="pill2 ${m.booking_open?'on':'off'}">${m.booking_open?'● Open':'Closed'}</span></td>
 <td><button class="btn g" onclick="aslots(${m.id})">Slots</button> <button class="btn g" onclick="mform(${m.id})">Edit</button> <button class="btn r" onclick="mdel(${m.id})">Del</button></td></tr>`).join('')}</table></div>`}
window.mform=id=>{const m=_am.find(x=>x.id===id)||{booking_open:1,total_slots:100,price:50};modal(`<h3>${id?'Edit':'New'} Match</h3><form onsubmit="msave(event,${id||0})"><label>Name</label><input name="name" value="${esc(m.name)}" required>
 <div class="row"><div><label>Date</label><input type="date" name="match_date" value="${esc(m.match_date)}" required></div><div><label>Time</label><input type="time" name="match_time" value="${esc(m.match_time)}" required></div></div>
 <div class="row"><div><label>Total Slots</label><input type="number" name="total_slots" value="${m.total_slots}" min="1" max="500" required></div><div><label>Slot Price ₹</label><input type="number" name="price" value="${m.price}" min="1" required></div></div>
 <label>Description</label><textarea name="description">${esc(m.description)}</textarea><label>Rules</label><textarea name="rules">${esc(m.rules)}</textarea>
 <label><input type="checkbox" name="booking_open" style="width:auto" ${m.booking_open?'checked':''}> Booking enabled</label><p class="err" id="e"></p><button class="btn">Save</button> <button type="button" class="btn g" onclick="closeM()">Cancel</button></form>`)};
window.msave=async(e,id)=>{e.preventDefault();const b=fd(e.target);b.booking_open=!!b.booking_open;try{await api(id?'/api/admin/matches/'+id:'/api/admin/matches',{method:id?'PUT':'POST',body:b});closeM();tab(1)}catch(x){$('#e').textContent=x.message}};
window.mdel=async id=>{if(!confirm('Delete this match and its slots?'))return;try{await api('/api/admin/matches/'+id,{method:'DELETE'});tab(1)}catch(x){alert(x.message)}};
window.aslots=async id=>{const d=modal('<div class="spin"></div>');const s=await api(`/api/admin/matches/${id}/slots`);
 d.firstChild.innerHTML=`<h3>Slots</h3><p class="mu">Tap an available slot to edit its price.</p><div class="slots">${s.map(x=>`<div class="slot ${x.status}" onclick="${x.status==='available'?`sprice(${x.id},${x.price},${id})`:''}"><b>#${x.number}</b>₹${x.price}<br>${x.status}${x.code?'<br>'+esc(x.code):''}</div>`).join('')}</div><p><button class="btn g" onclick="closeM()">Close</button></p>`};
window.sprice=async(id,p,mid)=>{const v=prompt('New price ₹',p);if(!v)return;try{await api('/api/admin/slots/'+id,{method:'PUT',body:{price:+v}});aslots(mid)}catch(x){alert(x.message)}};
async function pend(t){const r=await api('/api/admin/bookings?status=PENDING_VERIFICATION');
 t.innerHTML=r.length?`<div class="card tbl"><table><tr><th>Gamer</th><th>Mobile</th><th>Game ID</th><th>Match / Slot</th><th>₹</th><th>UTR</th><th>Time</th><th>Proof</th><th></th></tr>${r.map(b=>`<tr><td>${esc(b.name)}<br><span class="mu">${esc(b.ign)}</span></td><td>${esc(b.mobile)}</td><td>${esc(b.game_id)}</td><td>${esc(b.match_name)} #${b.slot_number}</td><td>${b.amount}</td><td>${esc(b.utr)}</td><td>${new Date(b.created_at).toLocaleString()}</td>
 <td><button class="btn g" onclick="shot('${esc(b.screenshot)}')">View</button></td><td><button class="btn o" onclick="act(${b.id},'approve')">Approve</button> <button class="btn r" onclick="act(${b.id},'reject')">Reject</button></td></tr>`).join('')}</table></div>`:'<p class="mu">No pending payments 🎉</p>'}
window.act=async(id,a)=>{const note=a==='reject'?prompt('Reason (shown to gamer, optional)')||'':'';if(!confirm(a.toUpperCase()+' this payment?'))return;try{await api(`/api/admin/bookings/${id}/${a}`,{method:'POST',body:{note}});tab(2)}catch(x){alert(x.message);tab(2)}};
window.shot=async f=>{const d=modal('<div class="spin"></div>');try{const u=URL.createObjectURL(await api('/api/admin/shot/'+f,{blob:1}));
 d.firstChild.innerHTML=`<p class="mu">Click image to zoom</p><div class="zoom"><img src="${u}" onclick="this.classList.toggle('z')"></div><p><button class="btn g" onclick="closeM()">Close</button></p>`;d.firstChild.style.maxWidth='720px'}catch(x){d.firstChild.textContent=x.message}};
async function sett(t){const s=await api('/api/admin/settings');
 t.innerHTML=`<div class="card" style="max-width:480px"><form id="f"><label>UPI ID / VPA</label><input name="upi_id" value="${esc(s.upi_id)}" required><label>UPI Payee Name</label><input name="payee" value="${esc(s.payee)}" required>
 <label>Default slot price ₹</label><input name="default_price" type="number" value="${s.default_price}"><label>Payment Instructions</label><textarea name="instructions">${esc(s.instructions)}</textarea><p class="err" id="e"></p><button class="btn">Save</button></form></div><div class="card" style="max-width:480px;margin-top:14px"><h3>QR Preview</h3><p class="mu">Jitna amount, utna ka QR. Test karne ke liye amount daalo.</p><label>Test amount ₹</label><input id="pa" type="number" min="1" value="100"><div style="text-align:center"><img id="pq" alt="" style="width:200px;background:#fff;border-radius:10px;padding:6px;display:none"></div><p class="mu ctr" id="pl"></p></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/settings',{method:'PUT',body:fd(e.target)});$('#e').style.color='var(--ok)';$('#e').textContent='Saved. New QR codes use these details.'}catch(x){$('#e').style.color='var(--er)';$('#e').textContent=x.message}};
 const upd=()=>{const f=$('#f'),u=f.upi_id.value.trim(),a=+$('#pa').value||1,im=$('#pq');if(!/^[\w.-]{2,256}@[A-Za-z]{2,64}$/.test(u)){im.style.display='none';$('#pl').textContent='Valid UPI ID daalo, QR yahan dikhega';return}im.src=upiQR(u,f.payee.value||'FTW',a,'TEST').qr;im.style.display='inline-block';$('#pl').textContent='₹'+a+' → '+u};
 $('#f').upi_id.oninput=upd;$('#f').payee.oninput=upd;$('#pa').oninput=upd;upd()}

// ===== boot =====
document.querySelectorAll('.yr').forEach(e=>e.textContent=new Date().getFullYear());
$('#fl').src=$('header img').src;
$('#tg').textContent=document.documentElement.dataset.theme==='dark'?'☀️ Light Mode':'🌙 Dark Mode';
const closeMenu=()=>['#hb','#mn','#ov'].forEach(i=>$(i).classList.remove('open'));
window.toggleMenu=()=>{const o=!$('#mn').classList.contains('open');closeMenu();if(o)['#hb','#mn','#ov'].forEach(i=>$(i).classList.add('open'))};
$('#mn').addEventListener('click',e=>{if(e.target.closest('a'))closeMenu()});
$('#ov').onclick=closeMenu;addEventListener('hashchange',closeMenu);
route();
</script></body></html>
